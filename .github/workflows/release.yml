name: Package and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        # Announce only first-time stable or beta release tags.
        # Correction pushes still package and upload, but must not repost release notes.
        if: success() && github.event.created == true && github.event.forced != true && (!contains(github.ref_name, '-') || contains(github.ref_name, 'beta'))
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          EMBED_DESCRIPTION_LIMIT = 4096
          MESSAGE_EMBED_TEXT_LIMIT = 6000
          MESSAGE_EMBED_LIMIT = 10

          def discord_length(text):
              # Count UTF-16 units conservatively for characters such as emoji.
              return len(text.encode("utf-16-le")) // 2

          def split_description(text, limit):
              # Decode only complete characters if the limit falls inside a surrogate pair.
              prefix = text[:limit].encode("utf-16-le")[:limit * 2].decode("utf-16-le", errors="ignore")
              if len(prefix) == len(text):
                  return text, ""

              # Move intact lines to the next message if the current one has too little room.
              end = prefix.rfind("\n") + 1
              if not end:
                  next_line = text[:EMBED_DESCRIPTION_LIMIT + 1].partition("\n")[0]
                  if limit < EMBED_DESCRIPTION_LIMIT and discord_length(next_line) <= EMBED_DESCRIPTION_LIMIT:
                      return "", text

                  # An oversized line can span embeds. Prefer splitting between words.
                  end = prefix.rfind(" ") + 1 or len(prefix)
              return text[:end], text[end:]

          def build_messages(description, title, color, footer):
              message_title = title
              while description:
                  remaining = MESSAGE_EMBED_TEXT_LIMIT - discord_length(message_title) - discord_length(footer)
                  embeds = []
                  while description and remaining and len(embeds) < MESSAGE_EMBED_LIMIT:
                      chunk, description = split_description(description, min(EMBED_DESCRIPTION_LIMIT, remaining))
                      if not chunk:
                          break
                      if not chunk.strip():
                          continue

                      embed = {"description": chunk, "color": color}
                      if not embeds:
                          embed.update(title=message_title, footer={"text": footer})
                      embeds.append(embed)
                      remaining -= discord_length(chunk)

                  yield embeds
                  message_title = f"{title} (continued)"

          def send_message(request, payload):
              data = json.dumps(payload).encode("utf-8")
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, data, timeout=30) as response:
                          return response.status
                  except urllib.error.HTTPError as error:
                      retry_after = error.headers.get("Retry-After")
                      if error.code != 429 or retry_after is None or attempt == 2:
                          raise
                      error.close()
                      time.sleep(float(retry_after))

          def format_discord_markdown(markdown):
              formatted_lines = []
              in_code_block = False

              for line in markdown.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("```"):
                      in_code_block = not in_code_block
                      formatted_lines.append(line)
                      continue

                  if not in_code_block:
                      if stripped == "---":
                          continue

                      # Discord supports Markdown headings only through level 3.
                      # Preserve those and render deeper changelog headings as bold labels.
                      heading = re.fullmatch(r"#{4,6}\s+(.+?)(?:\s+#+)?", stripped)
                      if heading:
                          line = f"**{heading.group(1)}**"

                  formatted_lines.append(line)

              return "\n".join(formatted_lines)

          webhook_url = os.environ.get('DISCORD_WEBHOOK')
          if not webhook_url:
              print("Error: DISCORD_WEBHOOK secret is missing. Please add it to GitHub Secrets.")
              exit(1)

          version = os.environ.get('VERSION', 'Unknown')
          
          # Clean version string (remove 'v' prefix for the title)
          clean_version = version
          if version.startswith('v'):
              clean_version = version[1:]
          is_beta = "beta" in clean_version.lower()

          # Extract content from CHANGELOG.md
          changelog_body = ""
          try:
              if os.path.exists('CHANGELOG.md'):
                  with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                      # Find start of current version section (e.g. "## [2.0.6]")
                      start_marker = f"## [{clean_version}]"
                      start_pos = content.find(start_marker)
                      
                      if start_pos != -1:
                          # Find end of this section (start of next section "## [" or end of file)
                          # Start searching after the marker to avoid finding the current one
                          end_pos = content.find("## [", start_pos + len(start_marker))
                          
                          if end_pos == -1:
                              section = content[start_pos:]
                          else:
                              section = content[start_pos:end_pos]
                              
                          # Remove the first line (header) and strip whitespace
                          lines = section.split('\n')
                          if len(lines) > 0:
                              changelog_body = '\n'.join(lines[1:]).strip()
                              print(f"Successfully extracted changelog for version {clean_version}")
                      else:
                          print(f"Version {clean_version} not found in CHANGELOG.md")
          except Exception as e:
              print(f"Error reading CHANGELOG.md: {e}")

          # Normalize changelog Markdown for Discord's supported heading levels.
          if changelog_body:
              changelog_body = format_discord_markdown(changelog_body)

          # Use changelog body if found, otherwise fallback to release body
          fallback_body = "New beta version available for testing!" if is_beta else "New version released!"
          body = changelog_body.strip() if changelog_body else fallback_body

          # Define Project Links
          links = (
              "[CurseForge](https://www.curseforge.com/wow/addons/betterfriendlist/files) | "
              "[Wago](https://addons.wago.io/addons/betterfriendlist/version) | "
              "[WoWInterface](https://www.wowinterface.com/downloads/info26984-BetterFriendlist.html)"
          )

          beta_notice = ""
          if is_beta:
              beta_notice = (
                  "**Beta Version:** This is a preview build for testing before the next stable release. "
                  "Please report issues on Discord or GitHub.\n\n"
              )

          embed_title = (
              f"Beta Version {clean_version} available for testing!"
              if is_beta
              else f"Version {clean_version} released!"
          )
          embed_color = 5793266 if is_beta else 16766720 # Discord blurple for beta, gold for stable
          webhook_username = "BetterFriendlist Beta" if is_beta else "BetterFriendlist Release"
          footer_text = (
              "BetterFriendlist Beta - World of Warcraft Addon"
              if is_beta
              else "BetterFriendlist - World of Warcraft Addon"
          )

          # Confirm each message before sending the next, preserving options such as thread_id.
          webhook = urllib.parse.urlsplit(webhook_url)
          query = urllib.parse.parse_qsl(webhook.query, keep_blank_values=True)
          query = [(key, value) for key, value in query if key != "wait"]
          query.append(("wait", "true"))
          req = urllib.request.Request(webhook._replace(query=urllib.parse.urlencode(query)).geturl())
          req.add_header("Content-Type", "application/json")
          req.add_header("User-Agent", "GitHub-Action")

          description = f"{links}\n\n{beta_notice}{body}"
          messages = build_messages(description, embed_title, embed_color, footer_text)
          for number, embeds in enumerate(messages, start=1):
              payload = {
                  "username": webhook_username,
                  "avatar_url": "https://media.forgecdn.net/avatars/thumbnails/1514/711/64/64/638983629917728143.png",
                  "embeds": embeds,
              }

              try:
                  status = send_message(req, payload)
                  print(f"Discord message {number} sent successfully. Status code: {status}")
              except Exception as error:
                  print(f"Failed to send Discord message {number}: {error}")
                  exit(1)
